[build]
builder = "NIXPACKS"
# Placeholder satisfies Prisma schema validation during image build.
# Link Railway Postgres so the real DATABASE_URL is present at runtime.
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start:prod"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
